name: Render Remotion Video

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/episodes/**'

jobs:
  render:
    name: Render Video on Cloud
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Render Remotion Video
        run: npx remotion render src/index.ts Ep01Test out/video.mp4 --codec=h264 --crf=18

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jemtek-video
          path: out/video.mp4
          
